name: Actualizar reglas

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node actualizar-lista.js
      - run: |
          git config --global user.name "Bot Actualizador"
          git config --global user.email "bot@users.noreply.github.com"
          git add community_rules.json
          git commit -m "Actualización diaria [skip ci]" || echo "No hay cambios"
          git push
